---
name: Test Docker Images

"on":
  push:
    branches:
      - main
    paths:
      - 'images/ubuntu-slim/**'
      - '.github/workflows/docker-images.yml'
  pull_request:
    paths:
      - 'images/ubuntu-slim/**'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:


permissions:
  contents: read


jobs:
  test-images:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'releases/') }}

    strategy:
      matrix:
        directory:
          - images/ubuntu-slim

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: Run test.sh
        working-directory: ${{ matrix.directory }}
        run: bash ./test.sh
