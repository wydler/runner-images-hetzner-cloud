---
name: Test Docker Images

"on":
  push:
    branches:
      - main
    paths:
      - 'images/ubuntu-slim/**'
      - '.github/workflows/docker-images.yml'
  pull_request:
    paths:
      - 'images/ubuntu-slim/**'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-images:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'releases/') }}
    
    strategy:
      matrix:
        directory:
          - images/ubuntu-slim

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.head_ref }}

      - name: Run test.sh
        working-directory: ${{ matrix.directory }}
        run: bash ./test.sh
