---
name: Ubuntu - Build template for Ubuntu 22.04

"on":
   workflow_dispatch:
     inputs:
       location:
        type: choice
        required: true
        options:
          - hel1
          - fsn1
          - nbg1
        default: "hel1"
       servertype:
        type: choice
        required: true
        options:
          - cx33
          - cpx32
          - ccx13
        default: "cpx32"


env:
  OS: "ubuntu22"
  ARCH: "amd64"


concurrency:
  group: "runner-image-build-${{ github.workflow }}"
  cancel-in-progress: false


jobs:
  Set-Variables:
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: Assign ENV variable to workflow variable
        id: env
        shell: bash
        run: |
           echo "os=$OS" >> $GITHUB_OUTPUT
           echo "arch=$ARCH" >> $GITHUB_OUTPUT

      - name: Display Variable server os
        run: echo "${{ steps.env.outputs.os }}"

      - name: Display Variable server arch
        run: echo "${{ steps.env.outputs.arch }}"

    outputs:
      os: ${{ steps.env.outputs.os }}
      arch: ${{ steps.env.outputs.arch }}


  Trigger-CollectInformations:
    needs:
      - Set-Variables

    permissions:
      contents: read

    uses: ./.github/workflows/ubuntu_trigger_01-collect-metadata.yml
    with:
      os: ${{ needs.Set-Variables.outputs.os }}
      arch: ${{ needs.Set-Variables.outputs.arch }}


  Trigger-ImageBuilder:
    needs:
      - Set-Variables
      - Trigger-CollectInformations

    permissions:
      contents: write

    uses: ./.github/workflows/ubuntu_trigger_02-build-snaphot.yml
    with:
      gh_branch_name: ${{ needs.Trigger-CollectInformations.outputs.gh_branch_name }}
      gh_tag: ${{ needs.Trigger-CollectInformations.outputs.gh_tag }}
      gh_release_no: ${{ needs.Trigger-CollectInformations.outputs.gh_release_no }}
      gh_pr_commit_message: ${{ needs.Trigger-CollectInformations.outputs.gh_pr_commit_message }}
      app_working_dir: ${{ needs.Trigger-CollectInformations.outputs.app_working_dir }}
      app_sw_report_file_name: ${{ needs.Trigger-CollectInformations.outputs.app_sw_report_file_name }}
      app_sw_sbom_file_name: ${{ needs.Trigger-CollectInformations.outputs.app_sw_sbom_file_name }}
      hetzner_cloud_object_name: ${{ needs.Trigger-CollectInformations.outputs.hetzner_cloud_object_name }}
      hetzner_cloud_image_name: ${{ needs.Trigger-CollectInformations.outputs.hetzner_cloud_image_name }}
      hetzner_cloud_server_location: ${{ inputs.location }}
      hetzner_cloud_server_type: ${{ inputs.servertype }}
      hetzner_cloud_packer_hcl_file: ${{ needs.Trigger-CollectInformations.outputs.hetzner_cloud_packer_hcl_file }}

    secrets:
      gh_app_rihc_id: ${{ secrets.GH_APP_RIHC_ID }}
      gh_app_rihc_pk: ${{ secrets.GH_APP_RIHC_PRIVATE_KEY }}
      hetzner_cloud_token: ${{ secrets.HCLOUD_TOKEN }}


  Trigger-SoftwareReport:
    needs:
      - Trigger-CollectInformations
      - Trigger-ImageBuilder

    permissions:
      contents: read

    uses: ./.github/workflows/ubuntu_trigger_03-report.yml
    with:
      gh_branch_name: ${{ needs.Trigger-CollectInformations.outputs.gh_branch_name }}
      gh_tag: ${{ needs.Trigger-CollectInformations.outputs.gh_tag }}
      app_swrp_file_name: ${{ needs.Trigger-CollectInformations.outputs.app_sw_report_file_name }}
      app_readme_file: ${{ needs.Trigger-CollectInformations.outputs.app_readme_file }}
      app_working_dir: ${{ needs.Trigger-CollectInformations.outputs.app_working_dir }}

    secrets:
      gh_app_rihc_id: ${{ secrets.GH_APP_RIHC_ID }}
      gh_app_rihc_pk: ${{ secrets.GH_APP_RIHC_PRIVATE_KEY }}


  Trigger-PullRequest:
    needs:
      - Trigger-CollectInformations
      - Trigger-ImageBuilder
      - Trigger-SoftwareReport

    permissions:
      contents: write
      pull-requests: write

    uses: ./.github/workflows/ubuntu_trigger_04-pullrequest.yml
    with:
      gh_branch_name: ${{ needs.Trigger-CollectInformations.outputs.gh_branch_name }}
      gh_pr_title: ${{ needs.Trigger-CollectInformations.outputs.gh_pr_title }}
      gh_pr_body: ${{ needs.Trigger-SoftwareReport.outputs.app_swrp_difference_body }}
      gh_pr_commit_message: ${{ needs.Trigger-CollectInformations.outputs.gh_pr_commit_message }}
      gh_pr_labels: ${{ needs.Trigger-CollectInformations.outputs.gh_pr_labels }}
      gh_release_no: ${{ needs.Trigger-CollectInformations.outputs.gh_release_no }}
      gh_default_branch_name: ${{ github.event.repository.default_branch }}

    secrets:
      gh_app_rihc_id: ${{ secrets.GH_APP_RIHC_ID }}
      gh_app_rihc_pk: ${{ secrets.GH_APP_RIHC_PRIVATE_KEY }}


  Trigger-Release:
    needs:
      - Trigger-CollectInformations
      - Trigger-ImageBuilder
      - Trigger-SoftwareReport
      - Trigger-PullRequest

    permissions:
      contents: write

    uses: ./.github/workflows/ubuntu_trigger_05-release.yml
    with:
      gh_tag: ${{ needs.Trigger-CollectInformations.outputs.gh_tag }}
      gh_release_title: ${{ needs.Trigger-CollectInformations.outputs.gh_release_title }}
      gh_release_body: ${{ needs.Trigger-SoftwareReport.outputs.app_swrp_difference_body }}
      app_swrp_file_name: ${{ needs.Trigger-CollectInformations.outputs.app_sw_report_file_name }}
      app_sw_sbom_file_name: ${{ needs.Trigger-CollectInformations.outputs.app_sw_sbom_file_name }}

    secrets:
      gh_app_rihc_id: ${{ secrets.GH_APP_RIHC_ID }}
      gh_app_rihc_pk: ${{ secrets.GH_APP_RIHC_PRIVATE_KEY }}


  Trigger-CleanupOnFailure:
    if: >
      always() &&
      (
        needs.Trigger-ImageBuilder.result != 'success' ||
        needs.Trigger-SoftwareReport.result != 'success' ||
        needs.Trigger-PullRequest.result != 'success' ||
        needs.Trigger-Release.result != 'success'
      )

    needs:
      - Trigger-CollectInformations
      - Trigger-ImageBuilder
      - Trigger-SoftwareReport
      - Trigger-PullRequest
      - Trigger-Release      

    permissions:
      contents: write

    uses: ./.github/workflows/ubuntu_trigger_07-cleanup-on-error.yml
    with:
      gh_branch_name: ${{ needs.Trigger-CollectInformations.outputs.gh_branch_name }}
      gh_tag: ${{ needs.Trigger-CollectInformations.outputs.gh_tag }}
      gh_release_no: ${{ needs.Trigger-CollectInformations.outputs.gh_release_no }}
      hetzner_cloud_object_name: ${{ needs.Trigger-CollectInformations.outputs.hetzner_cloud_object_name }}
      container_repo: ${{ needs.Trigger-CollectInformations.outputs.container_repo }}

    secrets:
      gh_app_rihc_id: ${{ secrets.GH_APP_RIHC_ID }}
      gh_app_rihc_pk: ${{ secrets.GH_APP_RIHC_PRIVATE_KEY }}
      container_registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
      container_registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
      hetzner_cloud_token: ${{ secrets.HCLOUD_TOKEN }}
