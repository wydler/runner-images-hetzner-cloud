---
name: Ubuntu - Trigger build Container Image

"on":
  workflow_call:
    inputs:
      gh_branch_name:
        required: true
        type: string
      gh_tag:
        required: true
        type: string
      gh_release_no:
        required: true
        type: string
      gh_pr_commit_message:
        required: true
        type: string
      app_working_dir:
        required: true
        type: string
      app_sw_report_file_name:
        required: true
        type: string
      container_registry_name:
        required: true
        type: string
      container_repo_tag:
        required: true
        type: string
      container_repo_cache_tag:
        required: true
        type: string
      container_platform:
        required: true
        type: string
    secrets:
      gh_app_rihc_id:
        required: true
      gh_app_rihc_pk:
        required: true
      container_registry_username:
        required: true
      container_registry_password:
        required: true
      cosign_private_key:
         required: true
      cosign_password:
        required: true


jobs:
  Create-NewBranch:
    runs-on: ubuntu-slim

    permissions:
      contents: write

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: generate-token
        with:
          client-id: "${{ secrets.gh_app_rihc_id }}"
          private-key: "${{ secrets.gh_app_rihc_pk }}"

      - name: Create a new branch
        uses: peterjgrainger/action-create-branch@4b81ce657e255acd677cc6c55c9c763654be3aef  # v4.0.0
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          branch: ${{ inputs.gh_branch_name }}


  Build-ContainerImage:
    runs-on: ubuntu-latest
    needs:
      - Create-NewBranch

    permissions:
      contents: write

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: generate-token
        with:
          client-id: "${{ secrets.gh_app_rihc_id }}"
          private-key: "${{ secrets.gh_app_rihc_pk }}"

      - name: Checkout new created branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: releases/${{ inputs.gh_tag }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ${{ inputs.container_registry_name }}
          username: ${{ secrets.container_registry_username }}
          password: ${{ secrets.container_registry_password }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        id: build
        with:
          context: ./${{ inputs.app_working_dir }}/
          file: ./${{ inputs.app_working_dir }}/Dockerfile
          push: true
          load: true
          build-args: |
            IMAGE_VERSION=${{ inputs.gh_release_no }}
            IMAGE_OWNER=${{ github.repository_owner }}
          tags: ${{ inputs.container_repo_tag }}
          platforms: ${{ inputs.container_platform }}
          cache-from: type=registry,ref=${{ inputs.container_repo_cache_tag }}
          cache-to: type=registry,ref=${{ inputs.container_repo_cache_tag }},mode=max

      - name: Test the new image
        shell: bash
        working-directory: ${{ inputs.app_working_dir }}
        run: |
          # Execute the container validation tests
          bash test.sh "$docker_tag"
        env:
          docker_tag: "${{ inputs.container_repo_tag }}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Show Cosign version
        run: |
          cosign version

      - name: Sign docker image with a key
        if: steps.build.outcome == 'success'
        id: sign
        shell: bash
        run: |                
          cosign sign \
            --new-bundle-format=true \
            --use-signing-config=false \
            --yes \
            --key env://COSIGN_PRIVATE_KEY ${{ inputs.container_registry_name }}/${{ inputs.container_repo_tag }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
          COSIGN_PASSWORD: ${{ secrets.cosign_password }}

      - name: Verify image signature
        if: steps.sign.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.container_registry_name }}/${{ inputs.container_repo_tag }}@${{ steps.build.outputs.digest }}"

          for i in {1..12}; do
            echo "Verification attempt ${i}/12..."

            if cosign verify \
                --key cosign.pub \
                --output text \
                "${IMAGE}"; then
              echo "Signature verified."

              exit 0
            fi

            echo "Signature not yet available. Waiting 5 seconds..."
            sleep 5
          done

          echo "ERROR: Signature could not be verified after 60 seconds."
          exit 1

      - name: Show Cosign artifact tree
        shell: bash
        run: |
          cosign tree ${{ inputs.container_registry_name }}/${{ inputs.container_repo_tag }}@${{ steps.build.outputs.digest }}

      - name: Generating software report
        shell: bash
        run: |
          # Change to the image-specific working directory that contains the report generation scripts
          cd ./${{ inputs.app_working_dir }}/

          # Generate a software inventory report for the newly built container image.
          # The report is later used for release notes and change tracking between image versions.
          bash generate-software-report.sh "$docker_tag"
        env:
          docker_tag: "${{ inputs.container_repo_tag }}"

      - name: Upload file ${{ inputs.app_sw_report_file_name }} to artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.app_sw_report_file_name }}
          path: ./${{ inputs.app_working_dir }}/${{ inputs.app_sw_report_file_name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Commit & Push changes
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc  # v1.6
        with:
          branch: ${{ inputs.gh_branch_name }}
          github_token: ${{ steps.generate-token.outputs.token }}
          message: ${{ inputs.gh_pr_commit_message }}
          force: true
          author_name: "${{ steps.generate-token.outputs.app-slug }}[bot]"
          author_email: "${{ steps.generate-token.outputs.app-slug }}[bot]@users.noreply.github.com"
