---
name: Ubuntu - Trigger build Server Snapshot

"on":
  workflow_call:
    inputs:
      gh_branch_name:
        required: true
        type: string
      gh_tag:
        required: true
        type: string
      gh_release_no:
        required: true
        type: string
      gh_pr_commit_message:
        required: true
        type: string
      app_working_dir:
        required: true
        type: string
      app_sw_report_file_name:
        required: true
        type: string
      app_sw_sbom_file_name:
        required: true
        type: string
      hetzner_cloud_object_name:
        required: true
        type: string
      hetzner_cloud_image_name:
        required: true
        type: string
      hetzner_cloud_server_location:
        required: true
        type: string
      hetzner_cloud_server_type:
        required: true
        type: string
      hetzner_cloud_packer_hcl_file:
        required: true
        type: string
    secrets:
      gh_app_rihc_id:
        required: true
      gh_app_rihc_pk:
        required: true
      hetzner_cloud_token:
        required: true


jobs:
  Create-NewBranch:
    runs-on: ubuntu-slim

    permissions:
      contents: write

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: generate-token
        with:
          client-id: "${{ secrets.gh_app_rihc_id }}"
          private-key: "${{ secrets.gh_app_rihc_pk }}"

      - name: Create a new branch
        uses: peterjgrainger/action-create-branch@4b81ce657e255acd677cc6c55c9c763654be3aef  # v4.0.0
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          branch: ${{ inputs.gh_branch_name }}


  Build-ServerImage:
    runs-on: ubuntu-latest
    needs:
      - Create-NewBranch

    permissions:
      contents: write

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: generate-token
        with:
          client-id: "${{ secrets.gh_app_rihc_id }}"
          private-key: "${{ secrets.gh_app_rihc_pk }}"

      - name: Checkout new created branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.gh_branch_name }}
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false  # https://github.com/orgs/community/discussions/179107

      - name: Setup `packer`
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789  # v3.4.0
        id: setup
        with:
          version: latest

      - name: Run `packer init`
        id: init
        shell: bash
        run: packer init ./${{ inputs.app_working_dir }}/templates/
        env:
          PACKER_GITHUB_API_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Run `packer validate`
        id: validate
        shell: bash
        run: packer validate -only "${{ inputs.hetzner_cloud_packer_hcl_file }}.*" ./${{ inputs.app_working_dir }}/templates/
        env:
          HCLOUD_TOKEN: ${{ secrets.hetzner_cloud_token }}
          HCLOUD_OBJECT_NAME: ${{ inputs.hetzner_cloud_object_name }}
          HCLOUD_SERVER_LOCATION: ${{ inputs.hetzner_cloud_server_location }}
          HCLOUD_SERVER_IMAGE: ${{ inputs.hetzner_cloud_image_name }}
          HCLOUD_SERVER_TYPE: ${{ inputs.hetzner_cloud_server_type }}
          IMAGE_VERSION: ${{ inputs.gh_release_no }}
          PACKER_GITHUB_API_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Run `packer build`
        id: build
        shell: bash
        run: packer build -only "${{ inputs.hetzner_cloud_packer_hcl_file }}.*" ./${{ inputs.app_working_dir }}/templates/
        env:
          HCLOUD_TOKEN: ${{ secrets.hetzner_cloud_token }}
          HCLOUD_OBJECT_NAME: ${{ inputs.hetzner_cloud_object_name }}
          HCLOUD_SERVER_LOCATION: ${{ inputs.hetzner_cloud_server_location }}
          HCLOUD_SERVER_IMAGE: ${{ inputs.hetzner_cloud_image_name }}
          HCLOUD_SERVER_TYPE: ${{ inputs.hetzner_cloud_server_type }}
          IMAGE_VERSION: ${{ inputs.gh_release_no }}
          PACKER_GITHUB_API_TOKEN: ${{ steps.generate-token.outputs.token }}
          PACKER_LOG: ${{ vars.PACKER_LOG }}

      - name: Upload file ${{ inputs.app_sw_report_file_name }} to artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.app_sw_report_file_name }}
          path: ./${{ inputs.app_working_dir }}/${{ inputs.app_sw_report_file_name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload file ${{ inputs.app_sw_sbom_file_name }} to artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.app_sw_sbom_file_name }}
          path: ./${{ inputs.app_working_dir }}/${{ inputs.app_sw_sbom_file_name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Remove ${{ inputs.app_sw_report_file_name }} and ${{ inputs.app_sw_sbom_file_name }}
        shell: bash
        run: |
          rm ./${{ inputs.app_working_dir }}/${{ inputs.app_sw_report_file_name }}
          rm ./${{ inputs.app_working_dir }}/${{ inputs.app_sw_sbom_file_name }}

      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: generate-token-commit
        with:
          client-id: ${{ secrets.gh_app_rihc_id }}
          private-key: ${{ secrets.gh_app_rihc_pk }}

      - name: Debug token
        shell: bash
        run: |
          echo "Token length: ${#TOKEN}"
        env:
          TOKEN: ${{ steps.generate-token-commit.outputs.token }}

      - name: Commit & Push changes
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc  # v1.6
        with:
          branch: ${{ inputs.gh_branch_name }}
          github_token: ${{ steps.generate-token-commit.outputs.token }}
          message: ${{ inputs.gh_pr_commit_message }}
          force: true
          author_name: "${{ steps.generate-token.outputs.app-slug }}[bot]"
          author_email: "${{ steps.generate-token.outputs.app-slug }}[bot]@users.noreply.github.com"
