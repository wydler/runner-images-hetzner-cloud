---
name: Ubuntu - Trigger release

"on":
  workflow_call:
    inputs:
      gh_tag:
        required: true
        type: string
      gh_release_title:
        required: true
        type: string
      gh_release_body:
        required: true
        type: string
      app_swrp_file_name:
        required: true
        type: string
      app_sw_sbom_file_name:
        required: false
        type: string
    secrets:
      gh_app_rihc_id:
        required: true
      gh_app_rihc_pk:
        required: true


jobs:
  Create-Release:
    runs-on: ubuntu-slim

    permissions:
      contents: write

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.gh_app_rihc_id }}
          private-key: ${{ secrets.gh_app_rihc_pk }}

      - name: Download file ${{ inputs.app_swrp_file_name }} from artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.app_swrp_file_name }}

      - name: Download file ${{ inputs.app_sw_sbom_file_name }} from artifact
        if: ${{ inputs.app_sw_sbom_file_name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.app_sw_sbom_file_name }}          

      - name: Create a new release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: ${{ inputs.gh_tag }}
          name: ${{ inputs.gh_release_title }}
          body: ${{ inputs.gh_release_body }}
          token: ${{ steps.generate-token.outputs.token }}
          draft: false
          prerelease: false
          artifacts: |
            ${{ inputs.app_swrp_file_name }}
            ${{ inputs.app_sw_sbom_file_name }}

      - name: Delete all artifacts associated with the run
        if: success()
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118  # v6.0.0
        with:
          name: |
            ${{ inputs.app_swrp_file_name }}
            ${{ inputs.app_sw_sbom_file_name }}
