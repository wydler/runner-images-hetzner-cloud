---
name: Ubuntu - Trigger publish

"on":
  workflow_call:
    inputs:
      container_registry_name:
        required: true
        type: string
      container_repo:
        required: true
        type: string
      container_repo_tag:
        required: true
        type: string
    secrets:
      container_registry_username:
        required: true
      container_registry_password:
        required: true


jobs:
  Publish-ContainerImage:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.container_registry_name }}
          username: ${{ secrets.container_registry_username }}
          password: ${{ secrets.container_registry_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Verify image exists
        run: |
          docker buildx imagetools inspect \
            ${{ inputs.container_repo_tag }}

      - name: Promote image to latest
        if: success()
        shell: bash
        run: |
          # Create or update the "latest" tag to point to the newly released image version.
          # This operation updates the manifest in the registry and preserves all platform variants.
          docker buildx imagetools create \
            -t ${{ inputs.container_repo }}:latest \
            ${{ inputs.container_repo_tag }}
